name: scrape-and-deploy

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - 'site/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/scrape.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Run scraper
        run: python scraper/scraper.py
      - name: Guard empty index
        run: |
          python -c "import json; m=json.load(open('data/meta.json')); assert m.get('totalFiles',0) > 1000, f\"empty index: {m.get('totalFiles')}\"; print(f\"index ok: {m.get('totalFiles')} files\")"
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/roms.json.gz data/meta.json
          git diff --cached --quiet || git commit -m "chore: update index $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push || true

  deploy:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
      - name: Prepare Pages artifact
        run: |
          python -c "import json; m=json.load(open('data/meta.json')); assert m.get('totalFiles',0) > 1000, 'refusing to deploy empty index'; print(f\"deploy ok: {m.get('totalFiles')} files\")"
          mkdir -p dist/data
          cp data/roms.json.gz dist/data/
          cp data/meta.json dist/data/
          ls -lh dist/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
