name: scrape-and-deploy

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Accept an index that is much smaller than the last one
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - 'site/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/scrape.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scrape: ${{ steps.filter.outputs.scrape }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Scheduled and manual runs always scrape. A push only scrapes when
          # the scraper itself changed, so site tweaks do not recrawl the source.
          scrape=true
          if [ "$EVENT" = "push" ] && files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename'); then
            if echo "$files" | grep -qE '^(scraper/|\.github/workflows/scrape\.yml$)'; then
              scrape=true
            else
              scrape=false
            fi
          fi
          echo "scrape=$scrape" >> "$GITHUB_OUTPUT"

  scrape:
    needs: changes
    if: needs.changes.outputs.scrape == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Test scraper
        run: python -m unittest discover -s scraper/tests
      - name: Build index
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: |
          args=""
          if [ "$ALLOW_SHRINK" = "true" ]; then args="--allow-shrink"; fi
          python scraper/scraper.py $args
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roms.json.gz data/meta.json
          if git diff --cached --quiet; then
            echo "index unchanged"
            exit 0
          fi
          git commit -m "chore: update index $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "could not push the index" >&2
          exit 1

  deploy:
    needs: [changes, scrape]
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
      - name: Prepare Pages artifact
        run: |
          python -c "import json; m=json.load(open('data/meta.json')); assert m.get('totalFiles',0) > 1000, 'refusing to deploy empty index'; print(f\"deploy ok: {m.get('totalFiles')} files\")"
          mkdir -p dist/data
          cp data/roms.json.gz dist/data/
          cp data/meta.json dist/data/
          ls -lh dist/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
